{% extends 'base.html' %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    
    <div class="card" style="width: 100%; max-width: 400px; padding: 40px;">
        
        <div style="text-align: center; margin-bottom: 32px;">
            <h1 style="font-size: 1.75rem; margin-bottom: 8px;">Reset Password</h1>
            <p style="color: var(--color-text-muted);">Enter your email to receive a reset link</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            {% if form.errors %}
                <div style="background: var(--color-error); color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;">
                    {{ form.non_field_errors.0 }}
                </div>
            {% endif %}

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 500;">
                    Email Address
                </label>
                <input type="email" name="email" class="form-input" required autofocus 
                       placeholder="you@example.com">
                {% if form.email.errors %}
                    <span style="color: var(--color-error); font-size: 0.85rem;">{{ form.email.errors.0 }}</span>
                {% endif %}
            </div>

            <button type="submit" class="btn btn-filled" style="width: 100%; margin-top: 8px;">
                Send Reset Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
            <a href="{% url 'login' %}" style="color: var(--color-primary); font-weight: 600;">← Back to Login</a>
        </div>

    </div>

</div>

<style>
    .form-input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-bg);
        color: var(--color-text-main);
        outline: none;
        font-size: 1rem;
        transition: border-color 0.2s;
    }
    .form-input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px var(--color-primary-container);
    }
</style>
{% endblock %}
