{% extends 'base.html' %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">

        <div style="font-size: 3rem; margin-bottom: 16px;">📧</div>

        <h1 style="font-size: 1.75rem; margin-bottom: 12px;">Check Your Email</h1>

        <p style="color: var(--color-text-muted); margin-bottom: 24px; line-height: 1.6;">
            If an account exists with the email you entered, you'll receive a password reset link shortly.
        </p>

        <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 24px;">
            The link will expire in <strong>30 minutes</strong>.
        </p>

        <a href="{% url 'login' %}" class="btn btn-filled" style="display: inline-block;">
            Return to Login
        </a>

    </div>

</div>
{% endblock %}
