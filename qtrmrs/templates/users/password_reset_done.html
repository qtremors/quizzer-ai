{% extends 'base.html' %}

{% block content %}
<div class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 48px 24px;">

    <div class="card" style="width: 100%; max-width: 440px; padding: 48px 32px; text-align: center; box-shadow: var(--elevation-3);">

        <div style="display: inline-flex; justify-content: center; align-items: center; width: 80px; height: 80px; background: var(--color-primary-container); color: var(--color-on-primary-container); border-radius: var(--radius-full); margin-bottom: 24px;">
            <span class="material-symbols-outlined" style="font-size: 40px;">mail</span>
        </div>

        <h1 style="font-size: 2rem; margin-bottom: 16px;">Check Your Email</h1>

        <p style="color: var(--color-on-surface-variant); margin-bottom: 24px; line-height: 1.6; font-size: 1.1rem;">
            If an account exists with the email you entered, you'll receive a password reset link shortly.
        </p>

        <div style="background: var(--color-surface-variant); padding: 12px; border-radius: var(--radius-md); margin-bottom: 32px; color: var(--color-on-surface-variant); font-size: 0.95rem;">
            The link will expire in <strong style="color: var(--color-on-surface);">30 minutes</strong>.
        </div>

        <a href="{% url 'login' %}" class="btn btn-filled" style="width: 100%; height: 56px; font-size: 1.1rem;">
            Return to Login
        </a>

    </div>

</div>
{% endblock %}
