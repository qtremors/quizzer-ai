{% extends 'base.html' %}

{% block content %}
<div class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 48px 24px;">

    <div class="card" style="width: 100%; max-width: 440px; padding: 48px 32px; text-align: center; box-shadow: var(--elevation-3);">

        <div style="display: inline-flex; justify-content: center; align-items: center; width: 80px; height: 80px; background: var(--color-success-container); color: var(--color-on-success-container); border-radius: var(--radius-full); margin-bottom: 24px;">
            <span class="material-symbols-outlined" style="font-size: 40px;">check_circle</span>
        </div>

        <h1 style="font-size: 2rem; margin-bottom: 12px;">Password Reset Complete</h1>

        <p style="color: var(--color-on-surface-variant); margin-bottom: 32px; font-size: 1.1rem; line-height: 1.5;">
            Your password has been successfully changed. You can now log in with your new password.
        </p>

        <a href="{% url 'login' %}" class="btn btn-filled" style="width: 100%; height: 56px; font-size: 1.1rem;">
            Log In
        </a>

    </div>

</div>
{% endblock %}
