{% extends 'base.html' %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">

        <div style="font-size: 3rem; margin-bottom: 16px; color: var(--color-success, #22c55e);">
            <span class="material-symbols-outlined" style="font-size: inherit;">check_circle</span>
        </div>

        <h1 style="font-size: 1.75rem; margin-bottom: 12px;">Password Reset Complete</h1>

        <p style="color: var(--color-text-muted); margin-bottom: 24px;">
            Your password has been successfully changed. You can now log in with your new password.
        </p>

        <a href="{% url 'login' %}" class="btn btn-filled" style="display: inline-block;">
            Log In
        </a>

    </div>

</div>
{% endblock %}
