{% extends 'base.html' %}

{% block title %}Quiz Agent - Quizzer AI{% endblock %}

{% block content %}
<div class="chat-container">

    <div class="chat-messages" id="chat-messages">

        <div class="message ai-message welcome-state" id="welcome-state" style="display: block; width: 100%; max-width: 100%;">
            <div class="welcome-container">
                <div class="welcome-headline text-gradient" style="font-family: var(--font-display);">Ready to learn?</div>
                <div class="welcome-sub">Ask me to generate a quiz on any topic.</div>

                <div class="quick-suggestions">
                    <button type="button" class="suggestion-chip" data-prompt="Create a quiz about Python decorators">
                        <span class="material-symbols-outlined">code</span> Python decorators
                    </button>
                    <button type="button" class="suggestion-chip" data-prompt="Quiz me on React hooks">
                        <span class="material-symbols-outlined">widgets</span> React hooks
                    </button>
                    <button type="button" class="suggestion-chip" data-prompt="Test my SQL knowledge">
                        <span class="material-symbols-outlined">database</span> SQL basics
                    </button>
                </div>
            </div>
        </div>

        <div id="loading-area" class="htmx-indicator">
            <div class="message ai-message animate-fade-in">
                <div class="avatar ai-avatar">
                    <span class="material-symbols-outlined filled">auto_awesome</span>
                </div>
                <div class="bubble outline-bubble" style="display: flex; align-items: center; gap: 12px; font-weight: 500;">
                    <span class="btn-spinner" style="width: 18px; height: 18px; border-width: 2px; border-color: var(--color-outline); border-top-color: var(--color-primary);"></span>
                    Generating quiz...
                </div>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
        <form id="chat-form" hx-post="{% url 'chat_process' %}" hx-target="#loading-area" hx-indicator="#loading-area" hx-disabled-elt="#chat-input, #send-btn" class="chat-input-wrapper elevation-3">

            {% csrf_token %}
            <input type="text" id="chat-input" name="message" placeholder="Ask Quizzer AI..." autocomplete="off" required>

            <div class="input-footer">
                <div class="input-tools">
                    <button type="button" class="icon-btn" title="Add files" disabled style="opacity: 0.5;">
                        <span class="material-symbols-outlined">add_circle</span>
                    </button>

                    <div class="tool-pill">
                        <span class="material-symbols-outlined">expand_more</span>
                        <select name="num_questions" title="Number of Questions">
                            <option value="5" selected>5 Qs</option>
                            <option value="10">10 Qs</option>
                            <option value="15">15 Qs</option>
                        </select>
                    </div>

                    <div class="tool-pill">
                        <span class="material-symbols-outlined">expand_more</span>
                        <select name="ai_model" title="AI Model">
                            {% for model in available_models %}
                            <option value="{{ model.id }}" {% if model.is_default %}selected{% endif %}>
                                {{ model.display_name }}
                            </option>
                            {% empty %}
                            <option value="">Flash Lite</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="input-actions-right">
                    <button type="submit" id="send-btn" class="send-btn">
                        <span class="btn-icon material-symbols-outlined">arrow_upward</span>
                    </button>
                </div>
            </div>

        </form>
        <div style="text-align: center; font-size: 0.75rem; color: var(--color-on-surface-variant); margin-top: 12px; margin-bottom: 8px;">
            AI can make mistakes. Check important info.
        </div>
    </div>

</div>

<script>
    document.body.addEventListener('htmx:configRequest', function (evt) {
        if (evt.target.id !== 'chat-form') return;
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) { evt.preventDefault(); return; }

        const welcomeState = document.getElementById('welcome-state');
        if (welcomeState) welcomeState.style.display = 'none';

        const chatMessages = document.getElementById('chat-messages');
        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'message user-message animate-fade-in';
        userMsgDiv.innerHTML = `<div class="bubble filled-bubble">${escapeHtml(message)}</div>`;
        const loadingArea = document.getElementById('loading-area');
        chatMessages.insertBefore(userMsgDiv, loadingArea);

        input.value = '';
        document.getElementById('send-btn').classList.add('is-loading');
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    document.body.addEventListener('htmx:afterSwap', function (evt) {
        document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        document.getElementById('send-btn').classList.remove('is-loading');
    });

    document.body.addEventListener('htmx:responseError', function (evt) {
        document.getElementById('send-btn').classList.remove('is-loading');
    });

    function escapeHtml(text) {
        const div = document.createElement('div'); div.textContent = text; return div.innerHTML;
    }

    document.querySelectorAll('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', function () {
            const input = document.getElementById('chat-input');
            input.value = this.dataset.prompt; input.focus();
        });
    });
</script>

<style>
    main.container { padding: 0 !important; max-width: 100% !important; height: calc(100vh - 64px); overflow: hidden; }
    
    .chat-container { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; position: relative; }
    
    .chat-messages { flex: 1; overflow-y: auto; padding: 40px 20px 180px 20px; display: flex; flex-direction: column; gap: 32px; scroll-behavior: smooth; }
    .chat-messages:empty, .chat-messages:has(.message:only-child) { justify-content: center; padding-bottom: 40px; }
    
    .message { display: flex; gap: 16px; width: 100%; max-width: 800px; margin: 0 auto; }
    
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .ai-avatar { background: transparent; color: var(--color-primary); }
    .ai-avatar .material-symbols-outlined { font-size: 32px; }
    
    .bubble { font-size: 1.05rem; line-height: 1.6; color: var(--color-on-surface); max-width: 90%; word-wrap: break-word; }
    
    .ai-message .bubble { padding: 12px 16px; }
    
    .user-message { flex-direction: row-reverse; }
    .filled-bubble { background: var(--color-surface-variant); padding: 12px 20px; border-radius: 20px; }
    
    .outline-bubble { background: transparent; border: 1px solid var(--color-outline-variant); padding: 12px 20px; border-radius: 20px; }
    
    .welcome-container { text-align: center; margin-bottom: 60px; padding: 0 20px; }
    .welcome-headline { font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 16px; font-weight: 500; letter-spacing: -1px; }
    .welcome-sub { color: var(--color-on-surface-variant); font-size: clamp(1.1rem, 2vw, 1.5rem); margin-bottom: 32px; }
    
    .quick-suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
    .suggestion-chip { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--color-surface); border: 1px solid var(--color-outline-variant); border-radius: var(--radius-full); font-size: 0.95rem; font-weight: 500; color: var(--color-on-surface); cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0, 0, 1); }
    .suggestion-chip:hover { background: var(--color-surface-variant); border-color: var(--color-outline); transform: translateY(-2px); }
    .suggestion-chip .material-symbols-outlined { font-size: 18px; color: var(--color-primary); }
    
    .chat-input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 20px 0 20px; background: linear-gradient(to top, var(--color-bg) 70%, transparent); display: flex; flex-direction: column; align-items: center; width: 100%; }
    
    .chat-input-wrapper { width: 100%; max-width: 800px; background: var(--color-surface-variant); border-radius: 24px; padding: 16px 20px 12px 20px; display: flex; flex-direction: column; gap: 12px; transition: all 0.2s; border: 1px solid transparent; }
    .chat-input-wrapper:focus-within { background: var(--color-surface); border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-container), var(--elevation-3); }
    
    #chat-input { width: 100%; border: none; background: transparent; font-size: 1.1rem; color: var(--color-on-surface); outline: none; resize: none; }
    #chat-input::placeholder { color: var(--color-on-surface-variant); font-weight: 400; }
    
    .input-footer { display: flex; justify-content: space-between; align-items: center; }
    .input-tools { display: flex; gap: 12px; align-items: center; }
    
    .tool-pill { position: relative; display: flex; align-items: center; }
    .tool-pill select { appearance: none; background: var(--color-surface); border: 1px solid var(--color-outline-variant); color: var(--color-on-surface-variant); padding: 8px 16px; padding-right: 32px; border-radius: var(--radius-full); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .tool-pill select:hover { background: var(--color-surface-variant); border-color: var(--color-outline); color: var(--color-on-surface); }
    .tool-pill .material-symbols-outlined { position: absolute; right: 10px; font-size: 16px; pointer-events: none; color: inherit; }
    
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; color: var(--color-on-surface-variant); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .icon-btn:hover { background: var(--color-surface); color: var(--color-on-surface); }
    
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--color-primary); color: var(--color-on-primary); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s cubic-bezier(0.2, 0, 0, 1); }
    .send-btn:hover { background: var(--color-primary-container); color: var(--color-on-primary-container); transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .send-btn.is-loading .btn-icon { display: none; }
    .send-btn.is-loading::after { content: ""; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: currentColor; border-radius: 50%; animation: spin 1s linear infinite; }
    
    .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.2, 0, 0, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: block; }
</style>
{% endblock %}
