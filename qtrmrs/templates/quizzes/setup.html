{% extends 'base.html' %}

{% block content %}
<div class="container" style="padding-top: 48px; padding-bottom: 80px;">
    <div style="max-width: 900px; margin: 0 auto;">

        <div style="text-align: center; margin-bottom: 40px;">
            <div style="display: inline-flex; justify-content: center; align-items: center; width: 64px; height: 64px; background: var(--color-primary-container); color: var(--color-on-primary-container); border-radius: var(--radius-full); margin-bottom: 16px;">
                <span class="material-symbols-outlined" style="font-size: 32px;">tune</span>
            </div>
            <h1 style="font-size: clamp(2rem, 3vw, 2.5rem); margin-bottom: 8px;">Configure Session</h1>
            <p style="color: var(--color-on-surface-variant); font-size: 1.1rem; margin: 0;">Customize your AI generation parameters.</p>
        </div>

        <div class="card" style="padding: 40px; box-shadow: var(--elevation-3);">

            <form hx-post="{% url 'create_quiz' %}" hx-indicator="#generate-btn" hx-disabled-elt="#generate-btn" class="setup-form">
                {% csrf_token %}

                <div class="setup-grid">

                    <div class="grid-col">
                        <h3 class="section-title">
                            <span class="material-symbols-outlined">menu_book</span>
                            Subject Matter
                        </h3>

                        <div class="form-group" style="margin-bottom: 24px;">
                            <label>Language / Technology</label>
                            <div class="select-wrapper" style="margin-bottom: 12px; position: relative;">
                                <select name="language_select" class="form-input" id="lang-select">
                                    <option value="Python">Python</option>
                                    <option value="JavaScript">JavaScript</option>
                                    <option value="TypeScript">TypeScript</option>
                                    <option value="React">React</option>
                                    <option value="Django">Django</option>
                                    <option value="SQL">SQL</option>
                                    <option value="Go">Go</option>
                                    <option value="Rust">Rust</option>
                                    <option value="C++">C++</option>
                                    <option value="Java">Java</option>
                                    <option value="CSS">CSS</option>
                                    <option value="HTML">HTML</option>
                                </select>
                                <span class="material-symbols-outlined arrow-icon" style="position: absolute; right: 16px; top: 16px; pointer-events: none; color: var(--color-on-surface-variant);">expand_more</span>
                            </div>
                            <input type="text" name="custom_language" placeholder="Or type custom (e.g. Kotlin)..." class="form-input" style="border-style: dashed; padding: 12px 16px;">
                        </div>

                        <div class="form-group">
                            <label>Specific Topic</label>
                            <input type="text" name="topic" required placeholder="e.g. Flexbox, Recursion" class="form-input">
                        </div>
                    </div>

                    <div class="grid-col">
                        <h3 class="section-title">
                            <span class="material-symbols-outlined">settings_suggest</span>
                            Constraints
                        </h3>
                        
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                            <div class="form-group" style="margin: 0;">
                                <label>Difficulty</label>
                                <div class="select-wrapper" style="position: relative;">
                                    <select name="level" class="form-input">
                                        <option value="Beginner">Beginner</option>
                                        <option value="Intermediate" selected>Intermediate</option>
                                        <option value="Expert">Expert</option>
                                    </select>
                                    <span class="material-symbols-outlined arrow-icon" style="position: absolute; right: 16px; top: 16px; pointer-events: none; color: var(--color-on-surface-variant);">expand_more</span>
                                </div>
                            </div>
                            <div class="form-group" style="margin: 0;">
                                <label>Length</label>
                                <div class="select-wrapper" style="position: relative;">
                                    <select name="num_questions" class="form-input">
                                        <option value="5" selected>5 Qs</option>
                                        <option value="10">10 Qs</option>
                                        <option value="15">15 Qs</option>
                                        <option value="20">20 Qs</option>
                                    </select>
                                    <span class="material-symbols-outlined arrow-icon" style="position: absolute; right: 16px; top: 16px; pointer-events: none; color: var(--color-on-surface-variant);">expand_more</span>
                                </div>
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 16px;">
                            <label>AI Model</label>
                            <div class="select-wrapper" style="position: relative;">
                                <select name="ai_model" class="form-input">
                                    {% for model in available_models %}
                                    <option value="{{ model.id }}" {% if model.is_default %}selected{% endif %}>
                                        {{ model.display_name }}
                                    </option>
                                    {% empty %}
                                    <option value="">Default (Flash Lite)</option>
                                    {% endfor %}
                                </select>
                                <span class="material-symbols-outlined arrow-icon" style="position: absolute; right: 16px; top: 16px; pointer-events: none; color: var(--color-on-surface-variant);">expand_more</span>
                            </div>
                        </div>

                        <div class="toggle-row" style="display: flex; justify-content: space-between; align-items: center; background: var(--color-surface-variant); padding: 16px 20px; border-radius: var(--radius-md); margin-top: 24px;">
                            <div>
                                <span style="font-weight: 600; font-size: 1rem; color: var(--color-on-surface); display: block;">Coding Challenges</span>
                                <span style="font-size: 0.85rem; color: var(--color-on-surface-variant);">Include code snippets</span>
                            </div>
                            <label class="switch">
                                <input type="checkbox" name="include_code">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 48px; border-top: 1px solid var(--color-outline-variant); padding-top: 32px; text-align: center;">

                    <button type="submit" id="generate-btn" class="btn btn-filled" style="height: 56px; padding: 0 40px; font-size: 1.1rem; width: 100%; max-width: 320px;">
                        <span class="btn-content" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <span class="material-symbols-outlined">auto_awesome</span> Generate Quiz
                        </span>
                        <span class="btn-loading" style="display: none; align-items: center; justify-content: center; gap: 12px;">
                            <span class="btn-spinner"></span> AI is thinking...
                        </span>
                    </button>
                    
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        const urlParam = "{{ initial_lang }}";
        if (urlParam) {
            const select = document.getElementById('lang-select');
            const customInput = document.querySelector('input[name="custom_language"]');
            if (select) {
                let foundInDropdown = false;
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value.toLowerCase() === urlParam.toLowerCase()) {
                        select.selectedIndex = i;
                        foundInDropdown = true;
                        break;
                    }
                }
                if (!foundInDropdown && customInput) {
                    customInput.value = urlParam;
                }
            }
        }
    })();
</script>

<style>
    .setup-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 48px;
    }
    
    .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.1rem;
        color: var(--color-primary);
        margin-bottom: 24px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--color-primary-container);
    }
    
    select {
        appearance: none;
        -webkit-appearance: none;
    }

    @media (max-width: 768px) {
        .setup-grid {
            grid-template-columns: 1fr;
            gap: 32px;
        }
    }

    #generate-btn.htmx-request .btn-content { display: none !important; }
    #generate-btn.htmx-request .btn-loading { display: flex !important; }
    #generate-btn.htmx-request { opacity: 0.8; cursor: wait; }
</style>
{% endblock %}
