<form hx-post="{% url 'submit_answer' quiz.id question.id %}" hx-target="#quiz-card-container" hx-swap="innerHTML" class="quiz-form fade-in">
    {% csrf_token %}
    <input type="hidden" name="time_taken" value="0">

    <div class="split-layout {% if question.code_snippet %}has-code{% endif %}">

        <div class="interaction-col">

            <div class="question-area">
                <h2>{{ question.text }}</h2>
            </div>

            <div class="options-grid">
                {% for option in question.options.all %}
                <label class="option-block" tabindex="0">
                    <input type="radio" name="option" value="{{ option.id }}" style="display: none;" onclick="enableNextBtn()">
                    <div class="option-visual card-interactive">
                        <div class="radio-indicator"></div>
                        <span class="opt-text">{{ option.text }}</span>
                    </div>
                </label>
                {% endfor %}
            </div>

            <div class="quiz-footer">
                <button type="submit" name="action" value="skip" class="btn btn-text" onclick="return confirm('Skip this question?');">
                    Skip
                </button>
                <button type="submit" name="action" value="next" id="next-btn" disabled class="btn btn-filled" style="opacity: 0.5;">
                    {% if is_last %}Finish{% else %}Next{% endif %}
                    <span class="material-symbols-outlined" style="font-size: 20px; margin-left: 6px;">arrow_forward</span>
                </button>
            </div>
        </div>

        {% if question.code_snippet %}
        <div class="code-col">
            <div class="code-window">
                <div class="code-header">
                    <div style="display: flex; gap: 6px;">
                        <div class="dot red"></div>
                        <div class="dot yellow"></div>
                        <div class="dot green"></div>
                    </div>
                    <span class="lang-label">{{ quiz.language|upper }}</span>
                </div>
                <pre><code class="language-{{ quiz.language|lower }}">{{ question.code_snippet }}</code></pre>
            </div>
        </div>
        {% endif %}

    </div>
</form>

<div style="display: none;">
    <div id="progress-bar" hx-swap-oob="true" class="progress-fill" style="width: {{ progress }}%;"></div>
    <span id="q-num" hx-swap-oob="true">{{ quiz.answers.count|add:"1" }}</span>
</div>

<script>
    function enableNextBtn() {
        const btn = document.getElementById('next-btn');
        if (btn) {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.classList.add('active'); // M3 interactions
        }
    }

    document.addEventListener('keydown', function(e) {
        const key = e.key;
        if (['1', '2', '3', '4'].includes(key)) {
            const options = document.querySelectorAll('input[name="option"]');
            const index = parseInt(key) - 1;
            if (options[index]) {
                options[index].checked = true;
                enableNextBtn();
            }
        }
        if (key === 'Enter') {
            const selected = document.querySelector('input[name="option"]:checked');
            if (selected) {
                const nextBtn = document.getElementById('next-btn');
                if (nextBtn && !nextBtn.disabled) nextBtn.click();
            }
        }
    });
</script>

<style>
    .quiz-form { height: 100%; width: 100%; }

    .split-layout {
        display: flex; flex-direction: column; width: 100%; height: 100%;
        max-width: 800px; margin: 0 auto;
    }

    .split-layout.has-code {
        display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
        max-width: 100%; align-items: stretch;
    }

    .interaction-col {
        display: flex; flex-direction: column; height: 100%; overflow-y: auto; min-width: 0;
    }

    .question-area { margin-bottom: 40px; }

    .question-area h2 {
        font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.4; font-weight: 500;
        color: var(--color-on-surface); word-wrap: break-word; overflow-wrap: break-word;
        font-family: var(--font-display);
    }

    .options-grid {
        display: flex; flex-direction: column; gap: 16px; margin-bottom: auto;
    }

    /* M3 Option visual overriding default interactive card slightly */
    .option-visual {
        display: flex; align-items: center; gap: 16px; padding: 20px 24px;
        background: var(--color-surface); border: 1px solid var(--color-outline-variant);
        border-radius: var(--radius-md); color: var(--color-on-surface);
        font-size: 1.1rem; cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .opt-text { word-break: break-word; }

    .radio-indicator {
        width: 24px; height: 24px; border-radius: var(--radius-full);
        border: 2px solid var(--color-on-surface-variant); flex-shrink: 0;
        transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .option-block:hover .option-visual {
        background: var(--color-surface-variant); border-color: var(--color-outline);
    }

    .option-block input:checked + .option-visual {
        background: var(--color-primary-container); border-color: var(--color-primary);
        color: var(--color-on-primary-container); font-weight: 500; box-shadow: 0 0 0 1px var(--color-primary);
    }

    .option-block input:checked + .option-visual .radio-indicator {
        border-color: var(--color-primary); background: var(--color-primary);
        box-shadow: inset 0 0 0 5px var(--color-primary-container);
    }

    .quiz-footer {
        display: flex; justify-content: space-between; align-items: center;
        padding-top: 40px; margin-top: 24px;
    }

    /* Code Window */
    .code-col {
        display: flex; flex-direction: column; height: 100%; max-height: 80vh; min-width: 0;
    }

    .code-window {
        background: #1e1e1e; border-radius: var(--radius-lg); overflow: hidden;
        box-shadow: var(--elevation-4); border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex; flex-direction: column; height: 100%;
    }

    .code-header {
        background: #252526; padding: 12px 20px; display: flex; align-items: center;
        justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; opacity: 0.8; }
    .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }

    .lang-label {
        color: #888; font-size: 0.85rem; font-family: monospace; font-weight: 600;
        letter-spacing: 0.05em; text-transform: uppercase;
    }

    .code-window pre[class*="language-"] {
        margin: 0; border-radius: 0; padding: 24px; flex-grow: 1; overflow: auto;
        white-space: pre; font-size: 0.95rem; width: 100%; font-family: 'Fira Code', 'Courier New', Courier, monospace;
    }

    @media (max-width: 1000px) {
        .split-layout.has-code { grid-template-columns: 1fr; gap: 32px; }
        .code-col { order: -1; height: auto; max-height: 400px; }
        .code-window { height: 100%; }
    }

    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.2, 0, 0, 1); }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .option-block:focus-within .option-visual {
        outline: 3px solid var(--color-primary); outline-offset: 2px;
    }
</style>
